<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario Runner｜後台排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-0:#081335; --sky-1:#12235c; --sky-2:#1c3a86;
    --coin:#ffd320; --coin-dark:#d99b00;
    --pipe:#43b047; --pipe-dark:#2c7a30;
    --brick:#c84c0c; --white:#fff;
    --silver:#d8dde6; --bronze:#d08a45;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Fredoka", system-ui, sans-serif;
    background:radial-gradient(120% 90% at 50% 0%, var(--sky-2) 0%, var(--sky-1) 45%, var(--sky-0) 100%);
    color:var(--white); overflow:hidden; height:100vh;
    font-variant-numeric:tabular-nums;
  }

  /* 背景星星 */
  #bg{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .bg-star{ position:absolute; background:#fff; border-radius:50%; opacity:.6;
    animation:tw linear infinite; }
  @keyframes tw{ 0%,100%{opacity:.15} 50%{opacity:.85} }

  /* 雙欄 */
  #app{ position:relative; z-index:2; height:100vh; display:flex; flex-direction:row;
    gap:30px; padding:24px 34px 18px; max-width:1360px; margin:0 auto; align-items:stretch; }
  #left-panel{ width:340px; flex:none; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }
  #right-panel{ flex:1; min-width:0; display:flex; flex-direction:column; }

  /* ── 左欄：城堡＋飄揚旗（含客戶 LOGO）── */
  #stage-title{ font-size:15px; letter-spacing:6px; color:rgba(255,255,255,.5);
    margin-bottom:6px; text-align:center; }
  #castle-stage{ position:relative; width:300px; height:340px; }
  .stage-castle-svg{ position:absolute; left:0; bottom:0; width:300px; }
  .stage-pole{ position:absolute; left:146px; bottom:150px; width:8px; height:150px;
    background:linear-gradient(#f2f2f2,#9a9a9a); border-radius:3px 3px 0 0; z-index:1; }
  .stage-pole::before{ content:''; position:absolute; left:50%; top:-8px; transform:translateX(-50%);
    width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff2a0, #ffd700 60%, #c99700);
    box-shadow:0 2px 3px rgba(0,0,0,.35); }
  .stage-flag{ position:absolute; left:154px; bottom:236px; width:88px; height:54px;
    background:#E52222; border:3px solid #fff; border-left:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:3px 3px 0 rgba(0,0,0,.25); z-index:2;
    transform-origin:left center; animation:flagWave 2.6s ease-in-out infinite; }
  @keyframes flagWave{
    0%,100%{ transform:perspective(240px) rotateY(0deg) skewY(0deg); }
    25%{ transform:perspective(240px) rotateY(-9deg) skewY(-2deg); }
    50%{ transform:perspective(240px) rotateY(0deg) skewY(0deg); }
    75%{ transform:perspective(240px) rotateY(9deg) skewY(2deg); }
  }
  .stage-flag-logo{ width:44px; height:44px; }
  .stage-flag-logo svg{ width:100%; height:100%; display:block; }

  /* Header */
  #header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .header-left{ display:flex; align-items:center; gap:14px; }
  .header-logo{ font-size:46px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35)); }
  .header-title{ font-size:32px; font-weight:700; letter-spacing:1px;
    text-shadow:0 3px 0 var(--brick), 0 5px 6px rgba(0,0,0,.4); }
  .header-sub{ font-size:12px; letter-spacing:5px; color:rgba(255,255,255,.5); margin-top:2px; }
  .header-right{ display:flex; align-items:center; gap:18px; text-align:center; }
  .live-dot{ display:inline-block; width:11px; height:11px; border-radius:50%;
    background:#ff4646; margin-right:7px; box-shadow:0 0 0 0 rgba(255,70,70,.6);
    animation:live 1.4s ease-out infinite; vertical-align:middle; }
  @keyframes live{ 0%{box-shadow:0 0 0 0 rgba(255,70,70,.6)} 100%{box-shadow:0 0 0 12px rgba(255,70,70,0)} }
  .live-label{ font-size:14px; letter-spacing:2px; font-weight:600; }
  .player-count{ font-size:30px; font-weight:700; color:var(--coin); line-height:1;
    text-shadow:0 2px 0 var(--coin-dark); }
  .player-count-label{ font-size:10px; letter-spacing:2px; color:rgba(255,211,32,.55); }
  #stop-btn{ font-family:inherit; font-size:12px; color:#fff; font-weight:600;
    background:linear-gradient(#e23b3b,#b81f1f); border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:9px 14px; cursor:pointer; transition:.15s; box-shadow:0 2px 0 #7a1010; }
  #stop-btn:hover{ filter:brightness(1.12); }
  #clear-btn{ font-family:inherit; font-size:12px; color:rgba(255,255,255,.55);
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:8px; padding:9px 12px; cursor:pointer; transition:.15s; }
  #clear-btn:hover{ color:#ff8080; border-color:rgba(255,128,128,.5); }

  /* 聚光大卡：目前第一名 */
  #champion{ position:relative; margin:4px 0 18px; padding:20px 26px;
    border-radius:22px; text-align:center;
    background:linear-gradient(160deg, rgba(255,211,32,.22), rgba(255,211,32,.05));
    border:2px solid rgba(255,211,32,.45);
    box-shadow:0 0 46px rgba(255,211,32,.22), inset 0 1px 0 rgba(255,255,255,.15);
    overflow:hidden; }
  #champion::before{ content:""; position:absolute; top:-60%; left:50%; width:150%; height:150%;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(255,240,150,.30), transparent 70%);
    pointer-events:none; }
  .champ-crown{ font-size:38px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
  .champ-label{ font-size:12px; letter-spacing:5px; color:rgba(255,240,180,.75); margin:2px 0 6px; }
  .champ-score{ font-size:60px; font-weight:700; color:var(--coin); line-height:1;
    text-shadow:0 3px 0 var(--coin-dark), 0 6px 14px rgba(0,0,0,.4); }
  .champ-score .pts{ font-size:20px; letter-spacing:3px; color:rgba(255,255,255,.6); margin-left:8px; }
  .champ-name{ font-size:26px; font-weight:600; margin-top:8px;
    text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .champ-empty .champ-score{ color:rgba(255,255,255,.4); text-shadow:none; }

  /* 榜單（可垂直捲動看完所有人；聚光大卡在此容器外，維持凍結） */
  #board-wrap{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:9px; padding-right:6px; }
  #board-wrap::-webkit-scrollbar{ width:8px; }
  #board-wrap::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:4px; }
  #board-wrap::-webkit-scrollbar-track{ background:transparent; }
  #empty-state{ display:none; flex:1; flex-direction:column; align-items:center;
    justify-content:center; color:rgba(255,255,255,.4); gap:10px; }
  #empty-state.show{ display:flex; }
  .empty-icon{ font-size:56px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .empty-text{ font-size:17px; letter-spacing:2px; }

  .rank-row{ display:flex; align-items:center; gap:16px; padding:12px 20px; flex:none;
    border-radius:14px; background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.08);
    animation:in .4s ease both; }
  @keyframes in{ from{opacity:0; transform:translateX(24px)} to{opacity:1; transform:none} }
  .rank-row.updated{ animation:pop .5s ease; }
  @keyframes pop{ 0%{background:rgba(255,211,32,.28)} 100%{background:rgba(255,255,255,.055)} }
  .rank-num{ font-size:20px; font-weight:700; width:38px; text-align:center;
    color:rgba(255,255,255,.5); }
  .rank-medal{ font-size:26px; width:34px; text-align:center; }
  .rank-name{ flex:1; font-size:21px; font-weight:600; }
  .rank-score{ font-size:26px; font-weight:700; color:var(--coin); }
  .rank-score .lbl{ font-size:11px; letter-spacing:2px; color:rgba(255,255,255,.45);
    display:block; text-align:right; margin-top:1px; }

  .rank-row.rank-1{ background:linear-gradient(100deg, rgba(255,211,32,.20), rgba(255,211,32,.04));
    border-color:rgba(255,211,32,.45); }
  .rank-row.rank-1 .rank-num, .rank-row.rank-1 .rank-name{ color:var(--coin); }
  .rank-row.rank-1 .rank-name{ font-size:23px; }
  .rank-row.rank-2{ border-color:rgba(216,221,230,.35); }
  .rank-row.rank-2 .rank-num, .rank-row.rank-2 .rank-name{ color:var(--silver); }
  .rank-row.rank-3{ border-color:rgba(208,138,69,.4); }
  .rank-row.rank-3 .rank-num, .rank-row.rank-3 .rank-name{ color:var(--bronze); }

  #footer{ text-align:center; font-size:11px; letter-spacing:2px;
    color:rgba(255,255,255,.3); padding-top:12px; }

  /* 全屏：一般新分數進榜 */
  #flash-overlay{ position:fixed; inset:0; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:rgba(8,19,53,.72); backdrop-filter:blur(4px); }
  #flash-overlay.show{ display:flex; animation:fade .3s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .flash-label{ font-size:30px; letter-spacing:3px; margin-bottom:14px; }
  .flash-name{ font-size:40px; font-weight:700; }
  .flash-score{ font-size:88px; font-weight:700; color:var(--coin);
    text-shadow:0 4px 0 var(--coin-dark), 0 8px 20px rgba(0,0,0,.5); }
  .flash-pts{ font-size:20px; letter-spacing:4px; color:rgba(255,255,255,.55); }

  /* 全屏：新第一名加冕 */
  #no1-overlay{ position:fixed; inset:0; z-index:30; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(closest-side, rgba(255,211,32,.28), rgba(8,19,53,.9)); }
  #no1-overlay.show{ display:flex; animation:fade .3s ease; }
  .no1-crown{ font-size:96px; animation:crown 1s ease infinite alternate; }
  @keyframes crown{ from{transform:translateY(0) scale(1)} to{transform:translateY(-14px) scale(1.08)} }
  .no1-label{ font-size:34px; font-weight:700; letter-spacing:2px; margin:10px 0 18px;
    color:var(--coin); text-shadow:0 3px 0 var(--coin-dark); }
  .no1-name{ font-size:46px; font-weight:700; }
  .no1-score{ font-size:100px; font-weight:700; color:var(--coin);
    text-shadow:0 4px 0 var(--coin-dark), 0 10px 24px rgba(0,0,0,.5); }
  .no1-pts{ font-size:22px; letter-spacing:5px; color:rgba(255,255,255,.6); }
  .no1-particle{ position:absolute; font-size:30px; z-index:31; pointer-events:none;
    animation:burst 1.9s ease-out forwards; }
  @keyframes burst{ 0%{transform:translate(0,0) rotate(0); opacity:1}
    100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)); opacity:0} }
</style>
</head>
<body>

<div id="bg"></div>

<!-- 全屏：一般新分數進榜 -->
<div id="flash-overlay">
  <div class="flash-label">🪙 金幣進帳！</div>
  <div class="flash-name" id="flash-name"></div>
  <div class="flash-score" id="flash-score"></div>
  <div class="flash-pts">PTS</div>
</div>

<!-- 全屏：新第一名 -->
<div id="no1-overlay">
  <div class="no1-crown">👑</div>
  <div class="no1-label">✨ 新的第一名！✨</div>
  <div class="no1-name" id="no1-name"></div>
  <div class="no1-score" id="no1-score"></div>
  <div class="no1-pts">PTS</div>
</div>

<div id="app">
  <!-- 左欄：城堡升旗（客戶 LOGO 飄揚） -->
  <div id="left-panel">
    <div id="stage-title">CHAMPION CASTLE</div>
    <div id="castle-stage">
      <svg class="stage-castle-svg" viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="64" width="28" height="66" fill="#a8501a"/>
        <rect x="166" y="64" width="28" height="66" fill="#a8501a"/>
        <rect x="4" y="58" width="9" height="8" fill="#a8501a"/><rect x="16" y="58" width="9" height="8" fill="#a8501a"/><rect x="28" y="58" width="6" height="8" fill="#a8501a"/>
        <rect x="166" y="58" width="9" height="8" fill="#a8501a"/><rect x="178" y="58" width="9" height="8" fill="#a8501a"/><rect x="190" y="58" width="4" height="8" fill="#a8501a"/>
        <rect x="30" y="70" width="140" height="60" fill="#c8621e"/>
        <rect x="30" y="62" width="16" height="10" fill="#c8621e"/><rect x="54" y="62" width="16" height="10" fill="#c8621e"/><rect x="78" y="62" width="16" height="10" fill="#c8621e"/><rect x="102" y="62" width="16" height="10" fill="#c8621e"/><rect x="126" y="62" width="16" height="10" fill="#c8621e"/><rect x="150" y="62" width="16" height="10" fill="#c8621e"/>
        <g stroke="rgba(0,0,0,0.12)" stroke-width="1.4">
          <line x1="30" y1="86" x2="170" y2="86"/><line x1="30" y1="102" x2="170" y2="102"/><line x1="30" y1="118" x2="170" y2="118"/>
        </g>
        <path d="M84 130 v-24 a16 16 0 0 1 32 0 v24 z" fill="#2a1708"/>
        <circle cx="58" cy="88" r="6" fill="#2a1708"/><circle cx="142" cy="88" r="6" fill="#2a1708"/>
        <rect x="72" y="26" width="56" height="46" fill="#b85a1a"/>
        <rect x="72" y="18" width="13" height="10" fill="#b85a1a"/><rect x="93" y="18" width="14" height="10" fill="#b85a1a"/><rect x="115" y="18" width="13" height="10" fill="#b85a1a"/>
        <line x1="72" y1="50" x2="128" y2="50" stroke="rgba(0,0,0,0.12)" stroke-width="1.4"/>
        <rect x="94" y="40" width="12" height="18" fill="#2a1708"/>
      </svg>
      <div class="stage-pole"></div>
      <div class="stage-flag"><div class="stage-flag-logo" id="stage-flag-logo"></div></div>
    </div>
  </div>

  <!-- 右欄：榜單 -->
  <div id="right-panel">
    <div id="header">
      <div class="header-left">
        <div class="header-logo">🍄</div>
        <div>
          <div class="header-title">MARIO RUNNER</div>
          <div class="header-sub">LEADERBOARD</div>
        </div>
      </div>
      <div class="header-right">
        <div><span class="live-dot"></span><span class="live-label">LIVE</span></div>
        <div>
          <div class="player-count" id="player-count">0</div>
          <div class="player-count-label">PLAYERS</div>
        </div>
        <button id="stop-btn">⏹ 全體停止</button>
        <button id="clear-btn">🗑 清除所有資料</button>
      </div>
    </div>

    <!-- 頂部聚光大卡 -->
    <div id="champion" class="champ-empty">
      <div class="champ-crown">👑</div>
      <div class="champ-label">目前第一名</div>
      <div class="champ-score"><span id="champ-score">—</span><span class="pts" id="champ-pts" style="display:none">PTS</span></div>
      <div class="champ-name" id="champ-name">等待玩家上場…</div>
    </div>

    <!-- 單欄榜單 -->
    <div id="board-wrap">
      <div id="empty-state" class="show">
        <div class="empty-icon">🪙</div>
        <div class="empty-text">等待玩家加入…</div>
      </div>
    </div>

    <div id="footer">分數即時更新 · KUYA MARIO RUNNER</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ============================================================
   ▼▼▼ 客戶 LOGO（左欄旗面）— 換客戶時只改這一段 ▼▼▼
   須與遊戲端 mario_runner.html 的 CLIENT_LOGO_SVG 一致
   ============================================================ */
const CLIENT_LOGO_SVG = `<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 800 800">
  <defs><style>.st0{fill:#024ad8;}.st1{fill:#fff;}</style></defs>
  <path class="st1" d="M400,0C179.07,0,0,179.09,0,400s179.07,400,400,400,400-179.08,400-400S620.93,0,400,0Z"/>
  <path class="st0" d="M400,770.47c-3.69,0-7.36-.07-11.01-.17l75.71-208.08h104.19c18.28,0,38.37-14.06,44.61-31.23l82.14-225.63c13.43-36.94-7.72-67.16-47.03-67.16h-144.55l-121.28,333.29h-.05l-68.76,188.92C150.86,721.62,29.53,575,29.53,400S143.96,86.85,299.97,43.2l-70.96,194.99h-.02l-117.95,324.01h78.52l100.3-275.33h59l-100.3,275.33h78.48l93.48-256.86c13.45-36.94-7.72-67.16-46.98-67.16h-66L383.35,29.92c5.52-.24,11.06-.39,16.65-.39,204.6,0,370.47,165.87,370.47,370.47s-165.87,370.47-370.47,370.47ZM624.15,286.7h-58.98l-82.62,226.67h59l82.62-226.67h-.02Z"/>
</svg>`;
/* ============================================================ */

/* ============================================================
   ▼▼▼ Firebase config（Mario 專案）▼▼▼
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDljq-hYpbIARnXXz6vka0Vmk4QWF0OE-M",
  authDomain: "mario-runner-4ca38.firebaseapp.com",
  databaseURL: "https://mario-runner-4ca38-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "mario-runner-4ca38",
  storageBucket: "mario-runner-4ca38.firebasestorage.app",
  messagingSenderId: "408758699932",
  appId: "1:408758699932:web:a80e4453f7a1f1b72d2a59"
};
const DB_PATH = "mario-scores";
const CONTROL_PATH = "mario-control/forceEnd"; // 全體停止訊號
/* ============================================================ */

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app, "https://mario-runner-4ca38-default-rtdb.asia-southeast1.firebasedatabase.app");

// 填入客戶 LOGO 到左欄旗面
const stageLogoEl = document.getElementById('stage-flag-logo');
if (stageLogoEl) stageLogoEl.innerHTML = CLIENT_LOGO_SVG;

// 背景星星
const bgEl = document.getElementById('bg');
for(let i=0;i<70;i++){
  const s=document.createElement('div'); s.className='bg-star';
  const sz=Math.random()*2.5+0.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${2+Math.random()*5}s;animation-delay:${Math.random()*5}s`;
  bgEl.appendChild(s);
}

const MEDALS = ['🥇','🥈','🥉'];
const boardWrap   = document.getElementById('board-wrap');
const emptyState  = document.getElementById('empty-state');
const playerCount = document.getElementById('player-count');
const champion    = document.getElementById('champion');
const champScore  = document.getElementById('champ-score');
const champPts    = document.getElementById('champ-pts');
const champName   = document.getElementById('champ-name');

let prevScores = {};
let prevNo1Name = '';

function showFlash(name, score, isNewNo1){
  const EMOJIS = ['🪙','⭐','🍄','✨','🎉','🌟'];
  if(isNewNo1){
    const ov = document.getElementById('no1-overlay');
    document.getElementById('no1-name').textContent = name;
    document.getElementById('no1-score').textContent = score.toLocaleString();
    for(let i=0;i<18;i++){
      const el=document.createElement('div'); el.className='no1-particle';
      el.textContent=EMOJIS[i%EMOJIS.length];
      const tx=(Math.random()-0.5)*window.innerWidth*0.9;
      const ty=(Math.random()-0.5)*window.innerHeight*0.9;
      el.style.cssText='left:50%;top:50%;--tx:'+tx+'px;--ty:'+ty+'px;--rot:'+(Math.random()*360)+'deg;animation-delay:'+(i*0.06)+'s';
      ov.appendChild(el);
      setTimeout(()=>el.remove(),2000);
    }
    ov.classList.add('show');
    setTimeout(()=>ov.classList.remove('show'), 2800);
  } else {
    const ov = document.getElementById('flash-overlay');
    document.getElementById('flash-name').textContent = name;
    document.getElementById('flash-score').textContent = score.toLocaleString();
    ov.classList.add('show');
    setTimeout(()=>ov.classList.remove('show'), 1600);
  }
}

function updateChampion(sorted){
  if(!sorted.length){
    champion.classList.add('champ-empty');
    champScore.textContent='—'; champPts.style.display='none';
    champName.textContent='等待玩家上場…';
    return;
  }
  champion.classList.remove('champ-empty');
  champScore.textContent=sorted[0].score.toLocaleString();
  champPts.style.display='inline';
  champName.textContent=sorted[0].name;
}

function render(scores){
  const sorted = Object.values(scores).sort((a,b)=>b.score-a.score);
  playerCount.textContent = sorted.length;

  boardWrap.querySelectorAll('.rank-row').forEach(el=>el.remove());

  if(sorted.length===0){
    emptyState.classList.add('show');
    updateChampion([]);
    prevScores = {}; prevNo1Name = '';
    return;
  }
  emptyState.classList.remove('show');

  sorted.forEach((p,i)=>{
    const row = document.createElement('div');
    const rankClass = i<3 ? `rank-${i+1}` : '';
    const wasUpdated = prevScores[p.name] !== undefined && prevScores[p.name] !== p.score;
    row.className = `rank-row ${rankClass}`;
    row.style.animationDelay = (i*0.05)+'s';
    row.innerHTML = `
      <div class="rank-num">${i+1}</div>
      <div class="rank-medal">${i<3 ? MEDALS[i] : ''}</div>
      <div class="rank-name">${p.name}</div>
      <div class="rank-score">${p.score.toLocaleString()}<span class="lbl">PTS</span></div>
    `;
    if(wasUpdated) setTimeout(()=>row.classList.add('updated'), 100);
    boardWrap.appendChild(row);
  });

  sorted.forEach((p)=>{
    const isNew     = prevScores[p.name] === undefined;
    const isUpdated = prevScores[p.name] !== undefined && prevScores[p.name] !== p.score;
    if(isNew || isUpdated){
      const isNo1 = sorted[0].name === p.name && p.name !== prevNo1Name;
      showFlash(p.name, p.score, isNo1);
    }
  });

  updateChampion(sorted);
  prevNo1Name = sorted[0].name;

  prevScores = {};
  sorted.forEach(p=>{ prevScores[p.name]=p.score; });
}

// 即時監聽排行榜
onValue(ref(db, DB_PATH), (snap)=>{
  render(snap.exists() ? snap.val() : {});
});

// 全體停止：寫入時間戳，遊戲端偵測到即強制結算（不刪資料）
document.getElementById('stop-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要強制結束所有「正在遊玩」的玩家嗎？')) return;
  if(!confirm('再次確認：送出後遊玩中玩家會立即進入結算，繼續嗎？')) return;
  await set(ref(db, CONTROL_PATH), Date.now());
  alert('⏹ 已送出全體停止訊號！');
});

// 清除所有資料（雙重確認）
document.getElementById('clear-btn').addEventListener('click', async ()=>{
  if(!confirm('確定要清除所有玩家分數嗎？\n此動作無法復原。')) return;
  if(!confirm('再次確認：清除後排行榜將歸零，繼續嗎？')) return;
  await remove(ref(db, DB_PATH));
  alert('✅ 已清除所有資料！');
});
</script>
